[project]
name = "proyecto-final-gestion-datos"
version = "0.1.0"
description = "Proyecto Final de Gestión de Datos: DWH + CLTV + segmentación de clientes (sector salud/bienestar)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Barreche" },
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E402: sys.path manipulation before imports es patrón estándar en Streamlit multipage
per-file-ignores = {"dashboard/**" = ["E402"]}